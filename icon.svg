<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad-tl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="grad-tr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad-bl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-br" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background circle/rounded plate -->
  <rect width="100" height="100" rx="22" fill="#18181b" />
  <!-- Quadrants -->
  <rect x="14" y="14" width="33" height="33" rx="6" fill="url(#grad-tl)" />
  <rect x="53" y="14" width="33" height="33" rx="6" fill="url(#grad-tr)" />
  <rect x="14" y="53" width="33" height="33" rx="6" fill="url(#grad-bl)" />
  <rect x="53" y="53" width="33" height="33" rx="6" fill="url(#grad-br)" />
  <!-- Center compass star -->
  <circle cx="50" cy="50" r="7" fill="#ffffff" />
  <polygon points="50,40 52,48 60,50 52,52 50,60 48,52 40,50 48,48" fill="#18181b" />
