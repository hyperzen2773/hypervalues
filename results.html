<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperValues</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg" href="icon.svg">
    <script src="theme.js"></script>
</head>
<body>
    <div class="main-container">
    <div class="main-results-wrapper">
        <div class="top-section">
            <div class="title-container">
                <h1>HyperValues</h1>
                <span class="version-text">v3.7</span>
            </div>
            <div id="results-container"></div>
        </div>
        
        <div class="bottom-section">
            <div id="label"></div>
            
            <div id="closest-section" style="display: none;">
                <p class="closest-heading">Next closest matches</p>
                <div id="closest-list"></div>
            </div>

            <p class="intro-text results-instruction">
                Click on any icon or label to view its description and original source.
            </p>
            
            <div id="buttons" style="margin-top: 30px;">
                <button onclick="location.href='index.html'">Back to menu</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="scoring.js"></script>
    <script>
        const results = JSON.parse(localStorage.getItem('quizResults') || '{}');
        const container = document.getElementById('results-container');
        const userResults = Object.values(results);

        categories.forEach(category => {
            const resultValue = results[category];
            if (resultValue) {
                const wrapper = document.createElement('a');
                wrapper.className = 'result-item';
                wrapper.href = `description.html?id=${resultValue}&cat=${category}`;
                wrapper.style.textDecoration = 'none';
                wrapper.style.color = 'inherit';

                const img = document.createElement('img');
                img.src = `icons/${category}/${resultValue}.svg`;
                img.className = 'result-icon';
                img.onerror = () => { img.style.display = 'none'; };

                const name = document.createElement('p');
                const displayName = (resultsMapping[category] && resultsMapping[category][resultValue])
                    ? resultsMapping[category][resultValue]
                    : resultValue.replace(/_/g, ' ');

                name.innerText = displayName;
                name.className = 'result-text';

                wrapper.appendChild(img);
                wrapper.appendChild(name);
                container.appendChild(wrapper);
            }
        });

        const matchedKey = Object.keys(labelMapping)
            .sort((a, b) => b.split('|').length - a.split('|').length)
            .find(key => {
                const requiredParts = key.split('|');
                return requiredParts.every(part => userResults.includes(part));
            });

        const finalLabel = matchedKey ? labelMapping[matchedKey] : "No exact match";
        const labelDiv = document.getElementById('label');
        labelDiv.className = "label-bubble";
        labelDiv.style.backgroundColor = labelColors[finalLabel] || "#7a7a7a";

        if (matchedKey) {
            labelDiv.innerHTML = `<a href="description.html?id=${encodeURIComponent(finalLabel)}&type=ideology&compare=1" style="color: inherit; text-decoration: none; display: block;">${finalLabel}</a>`;
        } else {
            labelDiv.innerText = finalLabel;
        }

        // ---------------------------------------------------------------------------
        // Closest matches (scoring lives in scoring.js)
        // ---------------------------------------------------------------------------
        const CLOSEST_COUNT = 3;
        const closestMatches = HV.closestIdeologies(results, finalLabel, CLOSEST_COUNT);
        const closestSection = document.getElementById('closest-section');
        const closestList = document.getElementById('closest-list');

        if (closestMatches.length > 0) {
            closestSection.style.display = 'flex';
            closestMatches.forEach((match, index) => {
                const color = (labelColors[match.label] || '#7a7a7a').slice(0, 7);

                // Same look as the original "Next closest match": an outlined bubble in the ideology's color
                const pill = document.createElement('a');
                pill.className = 'closest-pill';
                pill.href = `description.html?id=${encodeURIComponent(match.label)}&type=ideology&compare=1`;
                pill.style.setProperty('--pill-color', color);
                pill.title = `${match.identicalCount} of ${match.totalRequired} required values match yours`;

                const rank = document.createElement('span');
                rank.className = 'cp-rank';
                rank.textContent = `${index + 1}.`;
                const name = document.createElement('span');
                name.className = 'cp-name';
                name.textContent = match.label;
                const count = document.createElement('span');
                count.className = 'cp-count';
                count.textContent = `(${match.identicalCount}/${match.totalRequired})`;

                pill.append(rank, ' ', name, ' ', count);
                closestList.appendChild(pill);
            });
        }
    </script>
    </div>
</body>
</html>
