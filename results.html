<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperValues</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg" href="icon.svg">
    <script src="theme.js"></script>
</head>
<body>
    <div class="main-container">
    <div class="main-results-wrapper">
        <div class="top-section">
            <div class="title-container">
                <h1>HyperValues</h1>
                <span class="version-text">v3.7</span>
            </div>
            <div id="results-container"></div>
        </div>
        
        <div class="bottom-section">
            <div id="label"></div>
            
            <div id="closest-section" style="display: none;">
                <p class="closest-heading">Next closest matches</p>
                <p class="closest-hint">Tap one to compare its values with yours</p>
                <div id="closest-list"></div>
            </div>

            <p class="intro-text results-instruction">
                Click on any icon or label to view its description and original source.
            </p>
            
            <div id="buttons" style="margin-top: 30px;">
                <button onclick="location.href='index.html'">Back to menu</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        const results = JSON.parse(localStorage.getItem('quizResults') || '{}');
        const container = document.getElementById('results-container');
        const userResults = Object.values(results);

        categories.forEach(category => {
            const resultValue = results[category];
            if (resultValue) {
                const wrapper = document.createElement('a');
                wrapper.className = 'result-item';
                wrapper.href = `description.html?id=${resultValue}&cat=${category}`;
                wrapper.style.textDecoration = 'none';
                wrapper.style.color = 'inherit';

                const img = document.createElement('img');
                img.src = `icons/${category}/${resultValue}.svg`;
                img.className = 'result-icon';
                img.onerror = () => { img.style.display = 'none'; };

                const name = document.createElement('p');
                const displayName = (resultsMapping[category] && resultsMapping[category][resultValue])
                    ? resultsMapping[category][resultValue]
                    : resultValue.replace(/_/g, ' ');

                name.innerText = displayName;
                name.className = 'result-text';

                wrapper.appendChild(img);
                wrapper.appendChild(name);
                container.appendChild(wrapper);
            }
        });

        const matchedKey = Object.keys(labelMapping)
            .sort((a, b) => b.split('|').length - a.split('|').length)
            .find(key => {
                const requiredParts = key.split('|');
                return requiredParts.every(part => userResults.includes(part));
            });

        const finalLabel = matchedKey ? labelMapping[matchedKey] : "No exact match";
        const labelDiv = document.getElementById('label');
        labelDiv.className = "label-bubble";
        labelDiv.style.backgroundColor = labelColors[finalLabel] || "#7a7a7a";

        if (matchedKey) {
            labelDiv.innerHTML = `<a href="description.html?id=${encodeURIComponent(finalLabel)}&type=ideology" style="color: inherit; text-decoration: none; display: block;">${finalLabel}</a>`;
        } else {
            labelDiv.innerText = finalLabel;
        }

        // ---------------------------------------------------------------------------
        // Closest matches
        // score = (identical + 0.5 x same sub-group - clash penalties) x (identical / required values)
        //         / (number of value sets of the ideology) ^ 0.25
        // Every value is weighted by how rare it is across all ideologies. Clash penalties depend on the
        // pair of sub-groups (see incompatibleSubCategories in data.js).
        // ---------------------------------------------------------------------------
        const CLOSEST_COUNT = 3;
        const VARIANT_EXPONENT = 0.25;
        const WEIGHT_MIN = 0.5;
        const WEIGHT_MAX = 2;

        const categoryOf = {};
        Object.keys(resultsMapping).forEach(cat => {
            Object.keys(resultsMapping[cat]).forEach(id => {
                if (!(id in categoryOf)) categoryOf[id] = cat;
            });
        });

        function groupsOf(category, value) {
            const groups = subCategories[category] || {};
            return Object.keys(groups).filter(name => groups[name].includes(value));
        }

        // How a required value relates to the user's value in the same category:
        // identical, similar (shares a sub-group), clash (every pair of sub-groups clashes) or other.
        function relation(category, userVal, reqVal) {
            if (userVal === reqVal) return { type: 'identical', severity: 0 };
            const userGroups = groupsOf(category, userVal);
            const reqGroups = groupsOf(category, reqVal);
            if (userGroups.some(g => reqGroups.includes(g))) return { type: 'similar', severity: 0 };
            if (userGroups.length && reqGroups.length) {
                let mildest = Infinity;
                for (const a of userGroups) {
                    for (const b of reqGroups) {
                        const severity = (incompatibleSubCategories[a] || {})[b];
                        if (severity === undefined) return { type: 'other', severity: 0 };
                        if (severity < mildest) mildest = severity;
                    }
                }
                return { type: 'clash', severity: mildest };
            }
            return { type: 'other', severity: 0 };
        }

        // Rarity weights and value sets per ideology
        const ideologiesUsingValue = {};
        const valueSetsPerIdeology = {};
        const allKeyParts = [];
        Object.keys(labelMapping).forEach(key => {
            const label = labelMapping[key];
            valueSetsPerIdeology[label] = (valueSetsPerIdeology[label] || 0) + 1;
            key.split('|').forEach(part => {
                (ideologiesUsingValue[part] = ideologiesUsingValue[part] || new Set()).add(label);
                allKeyParts.push(part);
            });
        });
        const totalIdeologies = Object.keys(valueSetsPerIdeology).length;
        const rawWeight = {};
        Object.keys(ideologiesUsingValue).forEach(value => {
            rawWeight[value] = Math.log(1 + totalIdeologies / ideologiesUsingValue[value].size);
        });
        const meanWeight = allKeyParts.reduce((sum, part) => sum + rawWeight[part], 0) / allKeyParts.length;
        function valueWeight(value) {
            const weight = (rawWeight[value] || meanWeight) / meanWeight;
            return Math.min(WEIGHT_MAX, Math.max(WEIGHT_MIN, weight));
        }

        const scoredLabels = Object.keys(labelMapping)
            .map(key => {
                const requiredParts = key.split('|');
                const label = labelMapping[key];
                let credit = 0;
                let identicalWeight = 0;
                let totalWeight = 0;
                let identicalCount = 0;
                let broaderCount = 0;
                let clashCount = 0;

                requiredParts.forEach(reqVal => {
                    const weight = valueWeight(reqVal);
                    totalWeight += weight;
                    const category = categoryOf[reqVal];
                    if (!category) return;
                    const userVal = results[category];
                    if (!userVal) return;
                    const rel = relation(category, userVal, reqVal);
                    if (rel.type === 'identical') {
                        credit += weight;
                        identicalWeight += weight;
                        identicalCount++;
                    } else if (rel.type === 'similar') {
                        credit += weight * 0.5;
                        broaderCount++;
                    } else if (rel.type === 'clash') {
                        credit -= weight * rel.severity;
                        clashCount++;
                    }
                });

                let score = identicalCount > 0 ? (credit * identicalWeight) / totalWeight : 0;
                score = score / Math.pow(valueSetsPerIdeology[label], VARIANT_EXPONENT);
                return {
                    key,
                    label,
                    score,
                    identicalCount,
                    broaderCount,
                    clashCount,
                    totalRequired: requiredParts.length
                };
            })
            // higher score first; on equal scores the ideology with more identical values wins
            .sort((a, b) => (b.score - a.score) || (b.identicalCount - a.identicalCount))
            .filter(item => item.label !== finalLabel);

        const uniqueScoredLabels = [];
        const seenLabels = new Set();
        for (const item of scoredLabels) {
            if (!seenLabels.has(item.label)) {
                seenLabels.add(item.label);
                uniqueScoredLabels.push(item);
            }
        }

        const closestMatches = uniqueScoredLabels.filter(item => item.score > 0).slice(0, CLOSEST_COUNT);

        const closestSection = document.getElementById('closest-section');
        const closestList = document.getElementById('closest-list');
        const STATUS_MARK = { identical: '\u2713', similar: '\u2248', clash: '\u2715' };
        const STATUS_TEXT = {
            identical: 'Same value as yours',
            similar: 'Same sub-group as yours',
            clash: 'Clashes with yours'
        };

        function colorParts(color) {
            const hex = /^#([0-9a-fA-F]{6})/.exec(color || '');
            if (!hex) return null;
            return [0, 2, 4].map(i => parseInt(hex[1].substr(i, 2), 16) / 255);
        }

        function isLightColor(color) {
            const rgb = colorParts(color);
            if (!rgb) return false;
            const lin = rgb.map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
            return 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2] > 0.5;
        }

        function valuesByCategory(key) {
            const byCategory = {};
            key.split('|').forEach(part => {
                const cat = categoryOf[part];
                if (cat) byCategory[cat] = part;
            });
            return byCategory;
        }

        function displayName(cat, value) {
            return (resultsMapping[cat] && resultsMapping[cat][value])
                ? resultsMapping[cat][value]
                : value.replace(/_/g, ' ');
        }

        function statusOf(cat, value) {
            return results[cat] ? relation(cat, results[cat], value).type : 'other';
        }

        function makeIcon(cat, value) {
            const img = document.createElement('img');
            img.src = `icons/${cat}/${value}.svg`;
            img.alt = '';
            img.onerror = () => { img.style.display = 'none'; };
            return img;
        }

        // Values used by the other value sets of the same ideology, per category
        function alternativesFor(match) {
            const mainByCategory = valuesByCategory(match.key);
            const alternatives = {};
            Object.keys(labelMapping)
                .filter(key => labelMapping[key] === match.label && key !== match.key)
                .forEach(key => {
                    const other = valuesByCategory(key);
                    categories.forEach(cat => {
                        const entry = alternatives[cat] = alternatives[cat] || { values: [], any: false };
                        if (other[cat]) {
                            if (other[cat] !== mainByCategory[cat] && !entry.values.includes(other[cat])) {
                                entry.values.push(other[cat]);
                            }
                        } else if (mainByCategory[cat]) {
                            entry.any = true;
                        }
                    });
                });
            return alternatives;
        }

        function buildSlot(cat, mainValue, alternative) {
            const slot = document.createElement('div');
            slot.className = 'cd-slot';

            if (mainValue) {
                const status = statusOf(cat, mainValue);
                const link = document.createElement('a');
                link.className = 'cd-value';
                link.href = `description.html?id=${mainValue}&cat=${cat}`;

                const icon = document.createElement('span');
                icon.className = 'cd-icon';
                icon.appendChild(makeIcon(cat, mainValue));
                if (STATUS_MARK[status]) {
                    const badge = document.createElement('span');
                    badge.className = 'cd-badge ' + status;
                    badge.textContent = STATUS_MARK[status];
                    badge.title = STATUS_TEXT[status];
                    icon.appendChild(badge);
                }

                const name = document.createElement('span');
                name.className = 'cd-name';
                name.textContent = displayName(cat, mainValue);

                link.appendChild(icon);
                link.appendChild(name);
                slot.appendChild(link);
            } else {
                const empty = document.createElement('div');
                empty.className = 'cd-empty';
                const icon = document.createElement('span');
                icon.className = 'cd-icon cd-icon-empty';
                const name = document.createElement('span');
                name.className = 'cd-name';
                name.textContent = categoryTitles[cat] || cat;
                empty.appendChild(icon);
                empty.appendChild(name);
                slot.appendChild(empty);
            }

            if (alternative && (alternative.values.length || alternative.any)) {
                const box = document.createElement('div');
                box.className = 'cd-alts';
                const label = document.createElement('span');
                label.className = 'cd-alts-label';
                label.textContent = 'Other options';
                box.appendChild(label);
                alternative.values.forEach(value => {
                    const chip = document.createElement('a');
                    chip.className = 'cd-chip ' + statusOf(cat, value);
                    chip.href = `description.html?id=${value}&cat=${cat}`;
                    chip.appendChild(makeIcon(cat, value));
                    const text = document.createElement('span');
                    text.textContent = displayName(cat, value);
                    chip.appendChild(text);
                    box.appendChild(chip);
                });
                if (alternative.any) {
                    const chip = document.createElement('span');
                    chip.className = 'cd-chip any';
                    chip.textContent = 'Any value';
                    box.appendChild(chip);
                }
                slot.appendChild(box);
            }
            return slot;
        }

        function renderDetail(match, container) {
            const mainByCategory = valuesByCategory(match.key);
            const alternatives = alternativesFor(match);

            const grid = document.createElement('div');
            grid.className = 'cd-grid';
            categories.forEach(cat => {
                grid.appendChild(buildSlot(cat, mainByCategory[cat], alternatives[cat]));
            });
            container.appendChild(grid);

            const legend = document.createElement('p');
            legend.className = 'cd-legend';
            ['identical', 'similar', 'clash'].forEach(status => {
                const item = document.createElement('span');
                const badge = document.createElement('span');
                badge.className = 'cd-badge ' + status;
                badge.textContent = STATUS_MARK[status];
                item.appendChild(badge);
                item.appendChild(document.createTextNode(STATUS_TEXT[status]));
                legend.appendChild(item);
            });
            container.appendChild(legend);

            const sets = valueSetsPerIdeology[match.label];
            if (sets > 1) {
                const note = document.createElement('p');
                note.className = 'cd-note';
                note.textContent = `${sets} value sets: the one closest to yours is shown, the others differ where "Other options" appear.`;
                container.appendChild(note);
            }
            const more = document.createElement('p');
            more.className = 'cd-note';
            const link = document.createElement('a');
            link.href = `description.html?id=${encodeURIComponent(match.label)}&type=ideology`;
            link.textContent = 'Read about ' + match.label;
            more.appendChild(link);
            container.appendChild(more);
        }

        const entries = [];
        function toggleEntry(index) {
            entries.forEach((item, i) => {
                const open = i === index && item.pill.getAttribute('aria-expanded') !== 'true';
                item.pill.setAttribute('aria-expanded', open ? 'true' : 'false');
                item.detail.hidden = !open;
                if (open && !item.detail.dataset.ready) {
                    renderDetail(item.match, item.detail);
                    item.detail.dataset.ready = '1';
                }
                if (open && item.detail.scrollIntoView) item.detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
        }

        if (closestMatches.length > 0) {
            closestSection.style.display = 'flex';
            closestMatches.forEach((match, index) => {
                const color = labelColors[match.label] || '#7a7a7a';
                const light = isLightColor(color);

                const entry = document.createElement('div');
                entry.className = 'closest-entry';

                const pill = document.createElement('button');
                pill.type = 'button';
                pill.className = 'closest-pill';
                pill.style.setProperty('--pill-bg', color.slice(0, 7));
                pill.style.setProperty('--pill-fg', light ? '#18181b' : '#ffffff');
                pill.style.setProperty('--pill-chip', light ? 'rgba(0, 0, 0, 0.14)' : 'rgba(255, 255, 255, 0.22)');
                pill.setAttribute('aria-expanded', 'false');

                const rank = document.createElement('span');
                rank.className = 'cp-rank';
                rank.textContent = index + 1;
                const name = document.createElement('span');
                name.className = 'cp-name';
                name.textContent = match.label;
                const count = document.createElement('span');
                count.className = 'cp-count';
                count.textContent = `${match.identicalCount}/${match.totalRequired}`;
                count.title = `${match.identicalCount} of ${match.totalRequired} required values match yours`;
                const chevron = document.createElement('span');
                chevron.className = 'cp-chevron';
                chevron.setAttribute('aria-hidden', 'true');
                                [rank, name, count, chevron].forEach(el => pill.appendChild(el));

                const detail = document.createElement('div');
                detail.className = 'closest-detail';
                detail.hidden = true;

                pill.addEventListener('click', () => toggleEntry(index));
                entry.appendChild(pill);
                entry.appendChild(detail);
                closestList.appendChild(entry);
                entries.push({ match, pill, detail });
            });
        }
    </script>
    </div>
</body>
</html>
